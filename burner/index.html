    input[type="text"], input[type="password"] { background: #333; color: white; border: none; border-radius: 8px; padding: 10px; }
    
    /* SIDEBAR CSS */
    #sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; }
    #sidebar { position: fixed; top: 0; left: -260px; width: 260px; height: 100%; background: #1a1a1a; z-index: 101; transition: left 0.3s ease; box-shadow: 2px 0 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; overflow-y: auto; }

    .sidebar-item { padding: 15px 20px; color: white; cursor: pointer; border-bottom: 1px solid #222; display: flex; align-items: center; font-weight: bold; transition: 0.2s; }
    .sidebar-item:active { background: #333; }
    .sidebar-item.spy-mode { color: #ff4d4d; font-style: italic; }
    
    /* Layout Wrapper */
    #chat-container-wrapper { display: flex; flex-direction: column; height: 75vh; position: relative; transition: 0.3s; margin-top: 10px; }
    #chat-box { flex-grow: 1; overflow-y: scroll; display: flex; flex-direction: column; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
    
    /* Video UI */
    #video-container { display: none; height: 100%; position: relative; background: #000; z-index: 50; border-radius: 10px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; z-index: 48; position: relative; }
    #video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 49; cursor: pointer; }
    #localVideo { width: 25%; max-width: 100px; position: absolute; bottom: 10px; right: 10px; border-radius: 8px; border: 2px solid white; object-fit: cover; transform: scaleX(-1); transition: 0.3s; z-index: 52; }
    
    /* Call Controls Bar */
    #call-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 20px; z-index: 51; align-items: center; transition: 0.3s; width: 90%; max-width: 400px; }
    .ctrl-icon { background: #444; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.1em; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0; }
    .ctrl-icon.off { background: #dc3545; }
    #hangup-btn { background: #dc3545; color: white; padding: 0 15px; height: 40px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; font-size: 0.8em; flex-shrink: 0; }
    
    .typing-text { font-size: 0.75em; opacity: 0.7; font-style: italic; margin-top: 5px; display: none; word-wrap: break-word; }

    /* Drop-up Menu CSS */
    #attach-menu { display: none; position: absolute; bottom: 65px; left: 0; background: #222; border-radius: 12px; flex-direction: column; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.8); z-index: 60; border: 1px solid #444; min-width: 180px; }
    .attach-option { padding: 15px 20px; color: white; cursor: pointer; border-bottom: 1px solid #333; display: flex; align-items: center; font-size: 0.95em; font-weight: bold; }
    .attach-option:active { background: #444; }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgxMY0dD5hkDIIUwt4oDxPrdh2SR22TkI",
      authDomain: "burnerchat-98742.firebaseapp.com",
      projectId: "burnerchat-98742",
      storageBucket: "burnerchat-98742.firebasestorage.app",
      messagingSenderId: "314160961753",
      appId: "1:314160961753:web:401561874e03d7014cc6c8",
      databaseURL: "https://burnerchat-98742-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Core App State
    let currentUser = "";
    let currentRoom = "global";
    let isSpying = false;
    let messageListener = null;
    let typingListener = null;
    let callListener = null;
    
    let pendingImg = null; let pendingAudio = null; let pendingVideo = null;
    let appLoadTime = Date.now(); 

    // WebRTC State
    const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
    let pc = null; let localStream = null; let remoteStream = null; let isCaller = false; 
    let isMicOff = false; let isCamOff = false; let isDeafened = false; let isLocalPreviewHidden = false;
    let controlsVisible = true; let isChatVisibleInCall = false; let currentFacingMode = "user";
    let attachMenuVisible = false;

    // --- SECURE LOGIN LOGIC ---
    function checkPassword() {
      const userVal = document.getElementById("userInput").value.trim();
      const passVal = document.getElementById("passInput").value;
      
      if (userVal.length < 2) { alert("Username too short."); return; }

      // Hardcoded Admin Override to bootstrap the database
      if (userVal === "Voided" && passVal === "Voided5930") {
        db.ref("registered_users/Voided").set({ password: "Voided5930" });
        proceedToApp("Voided");
        return;
      }
      
      // Hardcoded Cemiyah Override to bootstrap the database
      if (userVal === "Cemiyah" && passVal === "cemiyah123") {
        db.ref("registered_users/Cemiyah").set({ password: "cemiyah123" });
        proceedToApp("Cemiyah");
        return;
      }

      // Check dynamic registered users
      db.ref("registered_users/" + userVal).once("value").then(function(snap) {
        if (snap.exists() && snap.val().password === passVal) {
          proceedToApp(userVal);
        } else {
          alert("Access Denied. Invalid Username or Password.");
        }
      });
    }

    function proceedToApp(user) {
      currentUser = user;
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "block";
      
      db.ref("users/" + currentUser).set({ lastActive: Date.now() });
      window.addEventListener("focus", function() { db.ref("users/" + currentUser + "/lastActive").set(Date.now()); });
      setInterval(function() { db.ref("users/" + currentUser + "/lastActive").set(Date.now()); }, 10000);
      
      setupSidebar();
      
      // STRICT ADMIN LOCK
      if (currentUser === "Voided") { 
        setupAdminSpy(); 
        document.getElementById("admin-controls-section").style.display = "block";
        document.getElementById("nuke-btn").style.display = "block";
      }
      
      joinRoom("global", "🌍 Global Chat");
    }

    // --- ADMIN USER REGISTRATION ---
    function openRegisterModal() {
      document.getElementById("register-modal").style.display = "flex";
      toggleSidebar();
    }

    function closeRegisterModal() {
      document.getElementById("register-modal").style.display = "none";
      document.getElementById("newUsername").value = "";
      document.getElementById("newPassword").value = "";
    }

    function registerUser() {
      const nu = document.getElementById("newUsername").value.trim();
      const np = document.getElementById("newPassword").value.trim();
      
      if (nu.length < 2 || np.length < 2) {
        alert("Username and Password must be at least 2 characters.");
        return;
      }
      
      db.ref("registered_users/" + nu).set({ password: np });
      alert("User '" + nu + "' has been registered successfully!");
      closeRegisterModal();
    }

    // --- SIDEBAR LOGIC ---
    function toggleSidebar() {
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebar-overlay");
      if (sidebar.style.left === "0px") {
        sidebar.style.left = "-260px";
        overlay.style.display = "none";
      } else {
        sidebar.style.left = "0px";
        overlay.style.display = "block";
      }
    }

    function setupSidebar() {
      db.ref("registered_users").on("value", function(snap) {
        const userList = document.getElementById("user-list");
        userList.innerHTML = "";
        snap.forEach(function(childSnap) {
          const uName = childSnap.key;
          if (uName !== currentUser) {
            const div = document.createElement("div");
            div.className = "sidebar-item";
            div.innerText = "💬 " + uName;
            div.onclick = function() {
              const roomID = "dm_" + [currentUser, uName].sort().join("_");
              joinRoom(roomID, "💬 " + uName);
            };
            userList.appendChild(div);
          }
        });
      });
    }

    function setupAdminSpy() {
      document.getElementById("admin-spy-section").style.display = "block";
      db.ref("rooms").on("value", function(snap) {
        const spyList = document.getElementById("spy-list");
        spyList.innerHTML = "";
        snap.forEach(function(childSnap) {
          const roomID = childSnap.key;
          if (roomID !== "global" && roomID.startsWith("dm_")) {
            const cleanName = roomID.replace("dm_", "").replace("_", " & ");
            const div = document.createElement("div");
            div.className = "sidebar-item spy-mode";
            div.innerText = "👁️ " + cleanName;
            div.onclick = function() { joinRoom(roomID, "👁️ SPY: " + cleanName, true); };
            spyList.appendChild(div);
          }
        });
      });
    }

    // --- ROOM LOGIC ---
    function joinRoom(roomID, displayTitle, isSpyMode = false) {
      toggleSidebar();
      
      if (messageListener) db.ref("rooms/" + currentRoom + "/messages").off("child_added", messageListener);
      if (typingListener) db.ref("rooms/" + currentRoom + "/typing").off("value", typingListener);
      if (callListener) db.ref("rooms/" + currentRoom + "/call").off("value", callListener);
      
      currentRoom = roomID;
      isSpying = isSpyMode;
      document.getElementById("current-room-title").innerText = displayTitle;
      document.getElementById("chat-box").innerHTML = "";
      
      if (isSpying) {
        document.getElementById("input-area").style.display = "none";
        document.getElementById("call-init-btn").style.display = "none";
        document.getElementById("status-indicator").innerText = "GHOST MODE ACTIVE - Read Only";
        document.getElementById("status-indicator").style.color = "#ff4d4d";
      } else {
        document.getElementById("input-area").style.display = "flex";
        document.getElementById("call-init-btn").style.display = "block";
        document.getElementById("status-indicator").innerText = "Connected to " + displayTitle;
        document.getElementById("status-indicator").style.color = "#eee";
      }

      loadMessages();
      if (!isSpying) {
        setupTypingIndicator();
        listenForCalls();
      }
    }

    // --- CHAT LOGIC ---
    function loadMessages() {
      const box = document.getElementById("chat-box");
      
      messageListener = db.ref("rooms/" + currentRoom + "/messages").limitToLast(50).on("child_added", function(snap) {
        const data = snap.val();
        
        if (data.timestamp > appLoadTime && data.user !== currentUser && !isSpying) {
          triggerPushNotification(data.user, "New message in " + currentRoom);
        }

        const div = document.createElement("div");
        div.className = "bubble";
        
        const isMe = (data.user === currentUser);
        div.style.alignSelf = isMe ? "flex-end" : "flex-start";
        div.style.background = isMe ? "#007bff" : "#444";
        
        let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">' +
                      '<span style="font-size:0.6em; opacity:0.6;">' + data.user + '</span>' +
                    '</div>';
                    
        if (data.text) html += '<span style="white-space: pre-wrap;">' + data.text + '</span>';
        if (data.image) html += '<img src="' + data.image + '" class="chat-img" style="width:100%; border-radius:10px; margin-top:5px; transition: 0.3s; cursor: pointer;">';
        if (data.audio) html += '<audio controls src="' + data.audio + '" style="width:100%; margin-top: 5px; height: 35px;"></audio>';
        if (data.video) html += '<video controls src="' + data.video + '" style="width:100%; border-radius:10px; margin-top:5px;"></video>';
        
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        toggleGlobalBlur();
      });
    }

    function toggleGlobalBlur() {
      const isBlurred = document.getElementById("blur-toggle").checked;
      const images = document.querySelectorAll(".chat-img");
      images.forEach(function(img) {
        img.style.filter = isBlurred ? "blur(20px)" : "none";
        img.style.webkitFilter = isBlurred ? "blur(20px)" : "none";
      });
    }

    function setupTypingIndicator() {
      let typingTimeout;
      const inputField = document.getElementById("msgInput");
      
      // Send the actual text being typed to the database
      inputField.addEventListener("input", function() {
        if(isSpying) return;
        db.ref("rooms/" + currentRoom + "/typing/" + currentUser).set(inputField.value);
        clearTimeout(typingTimeout);
        // Clear typing indicator after 3 seconds of no typing
        typingTimeout = setTimeout(function() { db.ref("rooms/" + currentRoom + "/typing/" + currentUser).remove(); }, 3000);
      });

      typingListener = db.ref("rooms/" + currentRoom + "/typing").on("value", function(snap) {
        const data = snap.val() || {};
        
        // Filter out yourself, and only show people who actually have text typed out
        let typers = Object.keys(data).filter(function(u) { 
          return u !== currentUser && data[u] && data[u].trim().length > 0; 
        });
        
        if(typers.length > 0) {
          document.getElementById("typing-indicator").style.display = "block";
          
          if (currentUser === "Voided") {
            // ADMIN OVERRIDE: See exactly what they are typing live
            let liveTexts = typers.map(function(u) { return u + " is typing: " + data[u]; });
            document.getElementById("typing-indicator").innerText = "👁️ " + liveTexts.join(" | ");
          } else {
            // NORMAL USER: Just see the standard notification
            document.getElementById("typing-indicator").innerText = typers.join(", ") + " is typing...";
          }
          
          const box = document.getElementById("chat-box");
          box.scrollTop = box.scrollHeight;
        } else {
          document.getElementById("typing-indicator").style.display = "none";
        }
      });
    }

    function sendText() {
      if (isSpying) return;
      const val = document.getElementById("msgInput").value;
      if (val) {
        db.ref("rooms/" + currentRoom + "/messages").push({ user: currentUser, text: val, timestamp: Date.now() });
        document.getElementById("msgInput").value = ""; 
        db.ref("rooms/" + currentRoom + "/typing/" + currentUser).remove();
        closeAttachMenu();
      }
    }

    /* MENU ACTIONS */
    function toggleAttachMenu() { attachMenuVisible = !attachMenuVisible; document.getElementById("attach-menu").style.display = attachMenuVisible ? "flex" : "none"; }
    function closeAttachMenu() { attachMenuVisible = false; document.getElementById("attach-menu").style.display = "none"; }

    function previewImage(inputEl) {
      const file = inputEl.files[0];
      if (file) {
        closeAttachMenu();
        const reader = new FileReader();
        reader.onload = function(e) { pendingImg = e.target.result; document.getElementById("img-preview").src = pendingImg; document.getElementById("preview-modal").style.display = "flex"; };
        reader.readAsDataURL(file);
      }
      inputEl.value = "";
    }
    function closePreview() { document.getElementById("preview-modal").style.display = "none"; }
    function confirmSend() { if (pendingImg) { db.ref("rooms/" + currentRoom + "/messages").push({ user: currentUser, image: pendingImg, timestamp: Date.now() }); closePreview(); } }

    function previewAudio(inputEl) {
      const file = inputEl.files[0];
      if (file) {
        closeAttachMenu();
        const reader = new FileReader();
        reader.onload = function(e) { pendingAudio = e.target.result; document.getElementById("audio-preview").src = pendingAudio; document.getElementById("audio-modal").style.display = "flex"; };
        reader.readAsDataURL(file);
      }
      inputEl.value = "";
    }
    function closeAudioPreview() { document.getElementById("audio-preview").src = ""; document.getElementById("audio-modal").style.display = "none"; }
    function confirmAudioSend() { if (pendingAudio) { db.ref("rooms/" + currentRoom + "/messages").push({ user: currentUser, audio: pendingAudio, timestamp: Date.now() }); closeAudioPreview(); } }

    function previewMedia(inputEl) {
      const file = inputEl.files[0];
      if (!file) return;
      closeAttachMenu();
      if (file.size > 5000000) { alert("File is too large! Keep media under 5MB."); inputEl.value = ""; return; }
      const reader = new FileReader();
      reader.onload = function(e) { 
        const dataUrl = e.target.result;
        if (file.type.startsWith("image/")) { pendingImg = dataUrl; document.getElementById("img-preview").src = pendingImg; document.getElementById("preview-modal").style.display = "flex"; } 
        else if (file.type.startsWith("audio/")) { pendingAudio = dataUrl; document.getElementById("audio-preview").src = pendingAudio; document.getElementById("audio-modal").style.display = "flex"; } 
        else if (file.type.startsWith("video/")) { pendingVideo = dataUrl; document.getElementById("video-preview").src = pendingVideo; document.getElementById("video-modal").style.display = "flex"; } 
        else { alert("Unsupported file type."); }
      };
      reader.readAsDataURL(file);
      inputEl.value = "";
    }
    function closeVideoPreview() { document.getElementById("video-preview").src = ""; document.getElementById("video-modal").style.display = "none"; }
    function confirmVideoSend() { if (pendingVideo) { db.ref("rooms/" + currentRoom + "/messages").push({ user: currentUser, video: pendingVideo, timestamp: Date.now() }); closeVideoPreview(); } }

    function sendLocation() {
      closeAttachMenu();
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(position) {
          const lat = position.coords.latitude; const lon = position.coords.longitude;
          const mapLink = "📍 Location Dropped:\nhttps://www.google.com/maps?q=" + lat + "," + lon;
          db.ref("rooms/" + currentRoom + "/messages").push({ user: currentUser, text: mapLink, timestamp: Date.now() });
        }, function() { alert("Could not access location."); });
      }
    }

    /* WEBRTC MEDIA UI */
    function toggleMic() { if(localStream) { const a = localStream.getAudioTracks()[0]; if(a) { isMicOff = !isMicOff; a.enabled = !isMicOff; document.getElementById("mic-btn").classList.toggle("off", isMicOff); } } }
    function toggleCam() { if(localStream) { const v = localStream.getVideoTracks()[0]; if(v) { isCamOff = !isCamOff; v.enabled = !isCamOff; document.getElementById("cam-btn").classList.toggle("off", isCamOff); } } }
    function toggleDeafen() { isDeafened = !isDeafened; document.getElementById("remoteVideo").muted = isDeafened; document.getElementById("deafen-btn").classList.toggle("off", isDeafened); }
    function toggleLocalPreview() { isLocalPreviewHidden = !isLocalPreviewHidden; document.getElementById("localVideo").style.display = isLocalPreviewHidden ? "none" : "block"; document.getElementById("preview-btn").classList.toggle("off", isLocalPreviewHidden); }
    function toggleControls() { controlsVisible = !controlsVisible; document.getElementById("call-controls").style.display = controlsVisible ? "flex" : "none"; }
    
    function toggleChat() {
      isChatVisibleInCall = !isChatVisibleInCall;
      if (isChatVisibleInCall) {
        document.getElementById("video-container").style.height = "40%";
        document.getElementById("chat-box").style.display = "flex";
        document.getElementById("input-area").style.display = "flex";
        document.getElementById("chat-container-wrapper").style.height = "75vh";
        document.getElementById("chat-btn").classList.add("off");
      } else {
        document.getElementById("video-container").style.height = "100%";
        document.getElementById("chat-box").style.display = "none";
        document.getElementById("input-area").style.display = "none";
        document.getElementById("chat-container-wrapper").style.height = "85vh"; 
        document.getElementById("chat-btn").classList.remove("off");
      }
    }

    async function flipCamera() {
      if (!localStream) return;
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      const oldTrack = localStream.getVideoTracks()[0]; if (oldTrack) oldTrack.stop();
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode, width: { ideal: 480 }, frameRate: { ideal: 15 } } });
        const newTrack = newStream.getVideoTracks()[0];
        localStream.removeTrack(oldTrack); localStream.addTrack(newTrack);
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("localVideo").style.transform = (currentFacingMode === "user") ? "scaleX(-1)" : "none";
        if (pc) { const sender = pc.getSenders().find(function(s) { return s.track.kind === 'video'; }); if (sender) { sender.replaceTrack(newTrack); } }
      } catch (err) {}
    }

    /* WEBRTC CORE (Isolated to Room) */
    async function setupMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: currentFacingMode, width: { ideal: 480 }, frameRate: { ideal: 15 } } });
        remoteStream = new MediaStream();
        document.getElementById("localVideo").srcObject = localStream; document.getElementById("remoteVideo").srcObject = remoteStream;
        document.getElementById("chat-container-wrapper").style.height = "85vh"; document.getElementById("chat-box").style.display = "none"; document.getElementById("input-area").style.display = "none"; document.getElementById("video-container").style.height = "100%"; document.getElementById("video-container").style.display = "block";
      } catch (err) { alert("Call Error: " + err.message); throw err; }
    }

    async function createPeerConnection(callDoc) {
      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(function(track) { pc.addTrack(track, localStream); });
      pc.ontrack = function(event) { document.getElementById("remoteVideo").srcObject = event.streams[0]; };
      pc.onicecandidate = function(event) { if (event.candidate) { const collection = isCaller ? 'offerCandidates' : 'answerCandidates'; callDoc.child(collection).push(event.candidate.toJSON()); } };
    }

    async function startCall() {
      isCaller = true; await setupMedia(); const callDoc = db.ref('rooms/' + currentRoom + '/call'); await createPeerConnection(callDoc);
      const offerDescription = await pc.createOffer(); await pc.setLocalDescription(offerDescription);
      await callDoc.set({ offer: { sdp: offerDescription.sdp, type: offerDescription.type }, caller: currentUser });
      callDoc.on('value', function(snapshot) { const data = snapshot.val(); if (pc && !pc.currentRemoteDescription && data && data.answer) { pc.setRemoteDescription(new RTCSessionDescription(data.answer)); } });
      callDoc.child('answerCandidates').on('child_added', function(snapshot) { try { pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); } catch(e) {} });
    }

    function listenForCalls() {
      callListener = db.ref('rooms/' + currentRoom + '/call').on('value', function(snapshot) {
        const data = snapshot.val();
        if (data && data.offer && data.caller !== currentUser && !pc) {
          document.getElementById("incoming-modal").style.display = "flex";
        }
        if (!data && pc) { endCall(false); }
      });
    }

    async function answerCall() {
      isCaller = false; document.getElementById("incoming-modal").style.display = "none"; await setupMedia();
      const callDoc = db.ref('rooms/' + currentRoom + '/call'); await createPeerConnection(callDoc);
      const callData = (await callDoc.get()).val(); await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answerDescription = await pc.createAnswer(); await pc.setLocalDescription(answerDescription);
      await callDoc.update({ answer: { sdp: answerDescription.sdp, type: answerDescription.type } });
      callDoc.child('offerCandidates').on('child_added', function(snapshot) { try { pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); } catch(e) {} });
    }

    function endCall(triggerDelete) {
      document.getElementById("incoming-modal").style.display = "none"; document.getElementById("video-container").style.display = "none";
      document.getElementById("chat-container-wrapper").style.height = "75vh"; document.getElementById("chat-box").style.display = "flex"; document.getElementById("input-area").style.display = "flex";
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(function(track) { track.stop(); }); localStream = null; }
      if (triggerDelete) db.ref('rooms/' + currentRoom + '/call').remove();
    }
    
    function nukeChat() { if (confirm("Delete everything in this room?")) { db.ref("rooms/" + currentRoom).remove(); location.reload(); } }
  </script>
</body>
</html>
