<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Burner Pro</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    body { font-family: sans-serif; transition: 0.3s; margin: 0; padding: 15px; overflow: hidden; height: 100vh; }
    .btn { padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .bubble { padding: 10px; border-radius: 15px; margin-bottom: 8px; max-width: 85%; word-wrap: break-word; position: relative; }
    
    .theme-dark { background: #121212; color: #eee; }
    .theme-matrix { background: #001a00; color: #00ff00; }
    .theme-vapor { background: #2b0031; color: #ff00ff; }
    .theme-red { background: #2e0000; color: #ff4d4d; }
    
    input[type="text"], input[type="password"] { background: #333; color: white; border: none; border-radius: 8px; padding: 10px; }
    #chat-screen > div:first-child select { margin-left: 8px; }
    #chat-screen > div:nth-child(4) input[type="text"] { margin-left: 8px; margin-right: 8px; }
    
    /* Layout Wrapper */
    #chat-container-wrapper { display: flex; flex-direction: column; height: 70vh; position: relative; transition: 0.3s; }
    #chat-box { flex-grow: 1; overflow-y: scroll; display: flex; flex-direction: column; padding: 10px; border-radius: 10px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
    
    /* Video UI adjustments */
    #video-container { display: none; height: 100%; position: relative; background: #000; z-index: 50; border-radius: 10px; overflow: hidden; margin-bottom: 10px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; z-index: 48; position: relative; }
    
    /* Invisible glass overlay to perfectly catch clicks for hiding the control bar */
    #video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 49; cursor: pointer; }
    
    #localVideo { width: 25%; max-width: 100px; position: absolute; bottom: 10px; right: 10px; border-radius: 8px; border: 2px solid white; object-fit: cover; transform: scaleX(-1); transition: 0.3s; z-index: 52; }
    
    /* Call Controls Bar - UPDATED to flex-wrap so buttons never fall off screen */
    #call-controls { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 20px; z-index: 51; align-items: center; transition: 0.3s; width: 90%; max-width: 400px; }
    .ctrl-icon { background: #444; color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 1.1em; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; flex-shrink: 0; }
    .ctrl-icon.off { background: #dc3545; }
    #hangup-btn { background: #dc3545; color: white; padding: 0 15px; height: 40px; border-radius: 30px; font-weight: bold; border: none; cursor: pointer; font-size: 0.8em; flex-shrink: 0; }
    
    .typing-text { font-size: 0.75em; opacity: 0.7; font-style: italic; margin-top: 5px; display: none; word-wrap: break-word; }
  </style>
</head>
<body class="theme-dark" id="main-body">

  <div id="login-screen" style="text-align: center; margin-top: 30%;">
    <h1 style="letter-spacing: 2px;">SECURE ACCESS</h1>
    <input type="password" id="passInput" placeholder="Enter Credentials..." style="width: 70%; text-align: center; font-size: 1.2em;">
    <br><br>
    <button class="btn" onclick="checkPassword()" style="background: #444; color: white; width: 50%; padding: 15px;">LOGIN</button>
  </div>

  <div id="chat-screen" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <div id="status-indicator" style="font-size: 0.75em; opacity: 0.7;">Locating...</div>
      <div style="display: flex; align-items: center;">
        <label style="color: white; font-size: 0.75em; display: flex; align-items: center; margin-right: 15px; cursor: pointer;">
          <input type="checkbox" id="blur-toggle" onchange="toggleGlobalBlur()" style="margin-right: 5px;"> Blur Images
        </label>
        <button class="btn" onclick="startCall()" style="background: #28a745; color: white; padding: 5px 15px; margin-right: 8px;">📞</button>
        <select onchange="changeTheme(this.value)" id="theme-selector" style="background: #333; color: white; border: none; border-radius: 5px; font-size: 0.8em; padding: 5px;">
          <option value="theme-dark">Dark</option>
          <option value="theme-red">Red</option>
          <option value="theme-matrix">Matrix</option>
          <option value="theme-vapor">Vapor</option>
        </select>
      </div>
    </div>

    <div id="chat-container-wrapper">
      <div id="video-container">
        <!-- Remote Video -->
        <video id="remoteVideo" autoplay playsinline></video>
        <!-- Invisible Overlay for Click Detection -->
        <div id="video-overlay" onclick="toggleControls()"></div>
        <!-- Local Video -->
        <video id="localVideo" autoplay muted playsinline></video>
        <!-- Call Controls -->
        <div id="call-controls">
          <button id="mic-btn" class="ctrl-icon" onclick="toggleMic()">🎤</button>
          <button id="cam-btn" class="ctrl-icon" onclick="toggleCam()">📷</button>
          <button id="flip-btn" class="ctrl-icon" onclick="flipCamera()">🔄</button>
          <button id="deafen-btn" class="ctrl-icon" onclick="toggleDeafen()">🔊</button>
          <button id="chat-btn" class="ctrl-icon" onclick="toggleChat()">💬</button>
          <button id="preview-btn" class="ctrl-icon" onclick="toggleLocalPreview()">👤</button>
          <button id="hangup-btn" onclick="endCall(true)">HANG UP</button>
        </div>
      </div>
      <div id="chat-box"></div>
    </div>

    <div id="typing-indicator" class="typing-text">Someone is typing...</div>

    <!-- Message Input Area -->
    <div id="input-area" style="display: flex; margin-top: 10px; align-items: center;">
      <label class="btn" style="background: #333; display: flex; align-items: center; justify-content: center; width: 40px; margin-right: 5px;">
        📷<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="previewImage()">
      </label>
      <label class="btn" style="background: #e0a800; display: flex; align-items: center; justify-content: center; width: 40px; margin-right: 8px;">
        🎤<input type="file" id="audioInput" accept="audio/*" capture="microphone" style="display: none;" onchange="previewAudio()">
      </label>
      <input type="text" id="msgInput" placeholder="Message..." style="flex-grow: 1; margin-right: 8px;">
      <button class="btn" onclick="sendText()" style="background: #007bff; color: white; padding: 0 20px;">SEND</button>
    </div>

    <button id="nuke-btn" class="btn" onclick="nukeChat()" style="display: none; background: #900; color: white; width: 100%; margin-top: 15px; font-size: 0.7em; opacity: 0.5;">NUKE DATABASE</button>
  </div>

  <!-- Modals -->
  <div id="preview-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center;">
    <h3 style="color: white;">Confirm Image?</h3>
    <img id="img-preview" style="max-width: 85%; max-height: 60%; border-radius: 10px; border: 2px solid white;">
    <div style="margin-top: 25px; display: flex;">
      <button class="btn" onclick="closePreview()" style="background: #555; color: white; padding: 15px 25px; margin-right: 20px;">CANCEL</button>
      <button class="btn" onclick="confirmSend()" style="background: #28a745; color: white; padding: 15px 30px;">SEND</button>
    </div>
  </div>

  <div id="audio-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center;">
    <h3 style="color: white;">Confirm Voice Note?</h3>
    <audio id="audio-preview" controls style="width: 80%; margin-bottom: 20px;"></audio>
    <div style="display: flex;">
      <button class="btn" onclick="closeAudioPreview()" style="background: #555; color: white; padding: 15px 25px; margin-right: 20px;">CANCEL</button>
      <button class="btn" onclick="confirmAudioSend()" style="background: #28a745; color: white; padding: 15px 30px;">SEND</button>
    </div>
  </div>

  <div id="incoming-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center;">
    <h2 style="color: white; margin-bottom: 30px;">Incoming Call...</h2>
    <div style="display: flex;">
      <button class="btn" onclick="endCall(true)" style="background: #dc3545; color: white; padding: 15px 30px; margin-right: 20px; border-radius: 30px;">DECLINE</button>
      <button class="btn" onclick="answerCall()" style="background: #28a745; color: white; padding: 15px 30px; border-radius: 30px;">ANSWER</button>
    </div>
  </div>

  <div id="context-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center;" onclick="if(event.target===this) closeMenu()">
    <div style="background: #222; width: 100%; padding: 20px; border-top-left-radius: 20px; border-top-right-radius: 20px; box-sizing: border-box; text-align: center;">
      <div style="width: 40px; height: 5px; background: #555; border-radius: 5px; margin: 0 auto 15px auto;"></div>
      <button class="btn" style="width:100%; background: #333; color: white; margin-bottom: 10px; padding: 15px;" onclick="copyMessage()">📋 Copy Text</button>
      <button class="btn" id="delete-everyone-btn" style="width:100%; background: #dc3545; color: white; margin-bottom: 10px; padding: 15px;" onclick="deleteForEveryone()">🗑️ Delete for Everyone</button>
      <button class="btn" style="width:100%; background: #ffc107; color: black; margin-bottom: 10px; padding: 15px;" onclick="deleteForMe()">👁️ Delete for Me</button>
      <button class="btn" style="width:100%; background: #555; color: white; padding: 15px;" onclick="closeMenu()">Cancel</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDgxMY0dD5hkDIIUwt4oDxPrdh2SR22TkI",
      authDomain: "burnerchat-98742.firebaseapp.com",
      projectId: "burnerchat-98742",
      storageBucket: "burnerchat-98742.firebasestorage.app",
      messagingSenderId: "314160961753",
      appId: "1:314160961753:web:401561874e03d7014cc6c8",
      databaseURL: "https://burnerchat-98742-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentUser = "";
    let otherUser = "";
    let otherUserLastActive = 0;
    
    let pendingImg = null;
    let pendingAudio = null;
    let activeMsgKey = null;
    let activeMsgText = "";
    let activeMsgSender = "";
    let appLoadTime = Date.now(); 

    const servers = { iceServers: [{ urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }] };
    let pc = null;
    let localStream = null;
    let remoteStream = null;
    let isCaller = false; 

    let isMicOff = false;
    let isCamOff = false;
    let isDeafened = false;
    let isLocalPreviewHidden = false;
    let controlsVisible = true;
    let isChatVisibleInCall = false; 
    let currentFacingMode = "user";

    let savedTheme = 'theme-dark';
    try {
      savedTheme = localStorage.getItem('user-theme') || 'theme-dark';
      document.getElementById('main-body').className = savedTheme;
      document.getElementById('theme-selector').value = savedTheme;
    } catch(e) { document.getElementById('main-body').className = 'theme-dark'; }

    function changeTheme(val) {
      document.getElementById('main-body').className = val;
      try { localStorage.setItem('user-theme', val); } catch(e) {}
    }

    function checkPassword() {
      const pass = btoa(document.getElementById("passInput").value);
      if (pass === "Y2VtaXlhaA==") { currentUser = "Cemiyah"; otherUser = "Voided"; setup(); } 
      else if (pass === "dm9pZGVk") { currentUser = "Voided"; otherUser = "Cemiyah"; setup(); } 
      else { alert("Access Denied"); }
    }

    function triggerPushNotification(title, body) {
      if (document.hidden) {
        if ("Notification" in window && Notification.permission === "granted") { new Notification(title, { body: body }); }
        if (navigator.vibrate) { navigator.vibrate([200, 100, 200]); }
      }
    }

    function toggleGlobalBlur() {
      const isBlurred = document.getElementById("blur-toggle").checked;
      const images = document.querySelectorAll(".chat-img");
      images.forEach(function(img) {
        img.style.filter = isBlurred ? "blur(20px)" : "none";
        img.style.webkitFilter = isBlurred ? "blur(20px)" : "none";
      });
    }

    function setup() {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("chat-screen").style.display = "block";
      if (currentUser === "Voided") document.getElementById("nuke-btn").style.display = "block";
      
      if ("Notification" in window && Notification.permission !== "granted") { Notification.requestPermission(); }

      window.addEventListener("focus", function() { db.ref("status/" + currentUser).set(Date.now()); });
      setInterval(function() { db.ref("status/" + currentUser).set(Date.now()); }, 10000);
      setInterval(updateSeenIndicator, 30000);

      db.ref("status").on("value", function(snap) {
        otherUserLastActive = snap.val() ? (snap.val()[otherUser] || 0) : 0;
        updateLastSeenText(otherUserLastActive);
        updateSeenIndicator();
      });

      setupTypingIndicator();
      loadMessages();
      listenForCalls();
    }

    function updateLastSeenText(timestamp) {
      const statusEl = document.getElementById("status-indicator");
      if (!timestamp) { statusEl.innerText = otherUser + ": Unknown"; return; }
      const diff = Math.floor((Date.now() - timestamp) / 1000);
      if (diff < 30) statusEl.innerText = otherUser + ": Active Now";
      else if (diff < 60) statusEl.innerText = otherUser + ": Active " + diff + "s ago";
      else statusEl.innerText = otherUser + ": Active " + Math.floor(diff/60) + "m ago";
    }

    function updateSeenIndicator() {
      const existing = document.getElementById("seen-indicator");
      if (existing) existing.remove();

      const box = document.getElementById("chat-box");
      const lastMsg = box.lastElementChild;

      if (!lastMsg || !lastMsg.classList.contains("bubble")) return;

      if (lastMsg.dataset.sender === currentUser) {
        const msgTime = parseInt(lastMsg.dataset.timestamp);
        const seenSpan = document.createElement("div");
        seenSpan.id = "seen-indicator";
        seenSpan.style.cssText = "font-size: 0.65em; opacity: 0.7; text-align: right; margin-top: -5px; margin-bottom: 10px; width: 100%;";

        if (otherUserLastActive >= msgTime) {
          const diffSeconds = Math.floor((Date.now() - otherUserLastActive) / 1000);
          if (diffSeconds < 60) { seenSpan.innerText = "Seen just now"; } 
          else {
            const mins = Math.floor(diffSeconds / 60);
            if (mins >= 60) { seenSpan.innerText = "Seen " + Math.floor(mins / 60) + "h ago"; } 
            else { seenSpan.innerText = "Seen " + mins + "m ago"; }
          }
        } else { seenSpan.innerText = "Delivered"; }
        box.appendChild(seenSpan);
      }
    }

    function setupTypingIndicator() {
      let typingTimeout;
      const inputField = document.getElementById("msgInput");
      inputField.addEventListener("input", function() {
        db.ref("typing/" + currentUser).set(inputField.value);
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(function() { db.ref("typing/" + currentUser).set(""); }, 3000);
      });

      db.ref("typing/" + otherUser).on("value", function(snap) {
        const typedText = snap.val() || "";
        if(typedText.length > 0) {
          document.getElementById("typing-indicator").style.display = "block";
          document.getElementById("typing-indicator").innerText = (currentUser === "Voided") ? otherUser + " is typing: " + typedText : otherUser + " is typing...";
          const box = document.getElementById("chat-box");
          box.scrollTop = box.scrollHeight;
        } else {
          document.getElementById("typing-indicator").style.display = "none";
        }
      });
    }

    function loadMessages() {
      const box = document.getElementById("chat-box");
      box.innerHTML = ""; 
      
      db.ref("messages").limitToLast(50).on("child_added", function(snap) {
        const key = snap.key;
        const data = snap.val();
        
        if (data.deletedFor && data.deletedFor[currentUser]) return;

        if (data.timestamp > appLoadTime && data.user !== currentUser) {
          let pushBody = "New message";
          if (data.text) pushBody = data.text;
          else if (data.image) pushBody = "📷 Sent an image";
          else if (data.audio) pushBody = "🎤 Sent a voice note";
          triggerPushNotification(data.user, pushBody);
        }

        const div = document.createElement("div");
        div.id = "msg-" + key;
        div.className = "bubble";
        div.dataset.sender = data.user;
        div.dataset.timestamp = data.timestamp;
        
        const isMe = (data.user === currentUser);
        div.style.alignSelf = isMe ? "flex-end" : "flex-start";
        div.style.background = isMe ? "#007bff" : "#444";
        
        const safeText = data.text ? data.text.replace(/'/g, "\\'").replace(/"/g, '&quot;') : "";
        
        let html = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">' +
                      '<span style="font-size:0.6em; opacity:0.6;">' + data.user + '</span>' +
                      '<button style="background:none; border:none; color:inherit; opacity:0.6; font-size:1.3em; cursor:pointer; padding: 0 5px;" onclick="openMenu(\'' + key + '\', \'' + safeText + '\', \'' + data.user + '\')">⋮</button>' +
                    '</div>';
                    
        if (data.text) html += '<span>' + data.text + '</span>';
        if (data.image) {
          html += '<img src="' + data.image + '" class="chat-img" style="width:100%; border-radius:10px; margin-top:5px; transition: 0.3s; cursor: pointer;">';
          html += '<br><button class="btn" style="font-size:0.6em; margin-top:8px; padding:5px; background:rgba(0,0,0,0.3); color:white; width:100%;" onclick="saveImg(\'' + data.image + '\')">OPEN & SAVE</button>';
        }
        if (data.audio) { html += '<audio controls src="' + data.audio + '" style="width:100%; margin-top: 5px; height: 35px;"></audio>'; }
        
        div.innerHTML = html;
        box.appendChild(div);
        
        if (document.hasFocus()) { db.ref("status/" + currentUser).set(Date.now()); }
        
        toggleGlobalBlur();
        updateSeenIndicator();
        box.scrollTop = box.scrollHeight;
      });

      db.ref("messages").on("child_removed", function(snap) {
        const el = document.getElementById("msg-" + snap.key);
        if (el) el.remove();
        updateSeenIndicator();
      });

      db.ref("messages").on("child_changed", function(snap) {
        const data = snap.val();
        if (data.deletedFor && data.deletedFor[currentUser]) {
          const el = document.getElementById("msg-" + snap.key);
          if (el) el.remove();
          updateSeenIndicator();
        }
      });
    }

    function openMenu(key, text, sender) {
      activeMsgKey = key; activeMsgText = text || ""; activeMsgSender = sender;
      document.getElementById("delete-everyone-btn").style.display = (sender === currentUser) ? "block" : "none";
      document.getElementById("context-modal").style.display = "flex";
    }

    function closeMenu() { document.getElementById("context-modal").style.display = "none"; }
    function copyMessage() {
      if (!activeMsgText) { closeMenu(); return; }
      const textArea = document.createElement("textarea");
      textArea.value = activeMsgText; textArea.style.position = "fixed"; 
      document.body.appendChild(textArea); textArea.focus(); textArea.select();
      try { document.execCommand('copy'); alert("Copied!"); } catch (err) { alert("Failed to copy text."); }
      document.body.removeChild(textArea); closeMenu();
    }
    function deleteForEveryone() { if (activeMsgKey) db.ref("messages/" + activeMsgKey).remove(); closeMenu(); }
    function deleteForMe() { if (activeMsgKey) db.ref("messages/" + activeMsgKey + "/deletedFor/" + currentUser).set(true); closeMenu(); }
    function saveImg(dataUrl) { const win = window.open(); win.document.write('<img src="' + dataUrl + '" style="width:100%;"><h2 style="text-align:center;">Long Press to Save</h2>'); }
    function sendText() {
      const val = document.getElementById("msgInput").value;
      if (val) {
        db.ref("messages").push({ user: currentUser, text: val, timestamp: Date.now() });
        document.getElementById("msgInput").value = ""; db.ref("typing/" + currentUser).set("");
      }
    }
    function previewImage() {
      const file = document.getElementById("cameraInput").files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) { pendingImg = e.target.result; document.getElementById("img-preview").src = pendingImg; document.getElementById("preview-modal").style.display = "flex"; };
        reader.readAsDataURL(file);
      }
    }
    function closePreview() { document.getElementById("preview-modal").style.display = "none"; }
    function confirmSend() {
      if (pendingImg) {
        db.ref("messages").push({ user: currentUser, image: pendingImg, timestamp: Date.now() });
        closePreview();
      }
    }
    function previewAudio() {
      const file = document.getElementById("audioInput").files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) { pendingAudio = e.target.result; document.getElementById("audio-preview").src = pendingAudio; document.getElementById("audio-modal").style.display = "flex"; };
        reader.readAsDataURL(file);
      }
    }
    function closeAudioPreview() { document.getElementById("audio-preview").src = ""; document.getElementById("audio-modal").style.display = "none"; }
    function confirmAudioSend() {
      if (pendingAudio) { db.ref("messages").push({ user: currentUser, audio: pendingAudio, timestamp: Date.now() }); closeAudioPreview(); }
    }
    function nukeChat() { if (confirm("Delete everything?")) { db.ref("messages").remove(); location.reload(); } }

    /* MEDIA CONTROLS */
    function toggleMic() {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          isMicOff = !isMicOff;
          audioTrack.enabled = !isMicOff;
          document.getElementById("mic-btn").classList.toggle("off", isMicOff);
        }
      }
    }

    function toggleCam() {
      if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          isCamOff = !isCamOff;
          videoTrack.enabled = !isCamOff;
          document.getElementById("cam-btn").classList.toggle("off", isCamOff);
        }
      }
    }

    function toggleDeafen() {
      const remoteVid = document.getElementById("remoteVideo");
      isDeafened = !isDeafened;
      remoteVid.muted = isDeafened;
      document.getElementById("deafen-btn").classList.toggle("off", isDeafened);
    }
    
    function toggleLocalPreview() {
      isLocalPreviewHidden = !isLocalPreviewHidden;
      document.getElementById("localVideo").style.display = isLocalPreviewHidden ? "none" : "block";
      document.getElementById("preview-btn").classList.toggle("off", isLocalPreviewHidden);
    }

    function toggleControls() {
      controlsVisible = !controlsVisible;
      document.getElementById("call-controls").style.display = controlsVisible ? "flex" : "none";
    }

    function toggleChat() {
      isChatVisibleInCall = !isChatVisibleInCall;
      const vidContainer = document.getElementById("video-container");
      const chatBox = document.getElementById("chat-box");
      const inputArea = document.getElementById("input-area");
      const wrapper = document.getElementById("chat-container-wrapper");
      const chatBtn = document.getElementById("chat-btn");

      if (isChatVisibleInCall) {
        vidContainer.style.height = "40%";
        chatBox.style.display = "flex";
        inputArea.style.display = "flex";
        wrapper.style.height = "70vh";
        chatBtn.classList.add("off");
        chatBox.scrollTop = chatBox.scrollHeight;
      } else {
        vidContainer.style.height = "100%";
        chatBox.style.display = "none";
        inputArea.style.display = "none";
        wrapper.style.height = "85vh"; 
        chatBtn.classList.remove("off");
      }
    }

    async function flipCamera() {
      if (!localStream) return;
      currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
      
      const oldTrack = localStream.getVideoTracks()[0];
      if (oldTrack) oldTrack.stop();
      
      try {
        const newStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 480 }, frameRate: { ideal: 15 } }
        });
        const newTrack = newStream.getVideoTracks()[0];
        
        localStream.removeTrack(oldTrack);
        localStream.addTrack(newTrack);
        
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("localVideo").style.transform = (currentFacingMode === "user") ? "scaleX(-1)" : "none";
        
        if (pc) {
          const sender = pc.getSenders().find(function(s) { return s.track.kind === 'video'; });
          if (sender) { sender.replaceTrack(newTrack); }
        }
      } catch (err) {
        alert("Camera flip failed: " + err.message);
      }
    }

    function resetMediaControls() {
      isMicOff = false; isCamOff = false; isDeafened = false; isLocalPreviewHidden = false; controlsVisible = true; currentFacingMode = "user";
      document.getElementById("mic-btn").classList.remove("off");
      document.getElementById("cam-btn").classList.remove("off");
      document.getElementById("deafen-btn").classList.remove("off");
      document.getElementById("preview-btn").classList.remove("off");
      
      document.getElementById("remoteVideo").muted = false;
      document.getElementById("localVideo").style.display = "block";
      document.getElementById("localVideo").style.transform = "scaleX(-1)";
      document.getElementById("call-controls").style.display = "flex";
      
      isChatVisibleInCall = false;
      if(document.getElementById("chat-btn")) document.getElementById("chat-btn").classList.remove("off");
    }

    /* WEBRTC SETUP */
    async function setupMedia() {
      try {
        const mediaConstraints = {
          audio: true,
          video: { facingMode: currentFacingMode, width: { ideal: 480 }, frameRate: { ideal: 15 } }
        };
        localStream = await navigator.mediaDevices.getUserMedia(mediaConstraints);
        remoteStream = new MediaStream();
        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("remoteVideo").srcObject = remoteStream;
        
        document.getElementById("chat-container-wrapper").style.height = "85vh";
        document.getElementById("chat-box").style.display = "none";
        document.getElementById("input-area").style.display = "none";
        document.getElementById("video-container").style.height = "100%";
        document.getElementById("video-container").style.display = "block";
        
        resetMediaControls();
      } catch (err) {
        alert("Call Error: " + err.name + " - " + err.message); throw err; 
      }
    }

    async function createPeerConnection(callDoc) {
      pc = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(function(track) { pc.addTrack(track, localStream); });
      pc.ontrack = function(event) { document.getElementById("remoteVideo").srcObject = event.streams[0]; };
      pc.onicecandidate = function(event) {
        if (event.candidate) {
          const collection = isCaller ? 'offerCandidates' : 'answerCandidates';
          callDoc.child(collection).push(event.candidate.toJSON());
        }
      };
    }

    async function startCall() {
      isCaller = true;
      await setupMedia();
      const callDoc = db.ref('call');
      await createPeerConnection(callDoc);
      const offerDescription = await pc.createOffer();
      await pc.setLocalDescription(offerDescription);
      await callDoc.set({ offer: { sdp: offerDescription.sdp, type: offerDescription.type }, caller: currentUser });

      callDoc.on('value', function(snapshot) {
        const data = snapshot.val();
        if (pc && !pc.currentRemoteDescription && data && data.answer) {
          pc.setRemoteDescription(new RTCSessionDescription(data.answer));
        }
      });

      callDoc.child('answerCandidates').on('child_added', function(snapshot) {
        try { pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); } 
        catch(e) { setTimeout(function() { if(pc) pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); }, 1000); }
      });
    }

    function listenForCalls() {
      db.ref('call').on('value', function(snapshot) {
        const data = snapshot.val();
        if (data && data.offer && data.caller !== currentUser && !pc) {
          document.getElementById("incoming-modal").style.display = "flex";
          triggerPushNotification("Incoming Call 📞", data.caller + " is calling you!");
        }
        if (!data && pc) { endCall(false); }
      });
    }

    async function answerCall() {
      isCaller = false;
      document.getElementById("incoming-modal").style.display = "none";
      await setupMedia();
      const callDoc = db.ref('call');
      await createPeerConnection(callDoc);

      const callData = (await callDoc.get()).val();
      await pc.setRemoteDescription(new RTCSessionDescription(callData.offer));
      const answerDescription = await pc.createAnswer();
      await pc.setLocalDescription(answerDescription);
      await callDoc.update({ answer: { sdp: answerDescription.sdp, type: answerDescription.type } });

      callDoc.child('offerCandidates').on('child_added', function(snapshot) {
        try { pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); } 
        catch(e) { setTimeout(function() { if(pc) pc.addIceCandidate(new RTCIceCandidate(snapshot.val())); }, 1000); }
      });
    }

    function endCall(triggerDelete) {
      document.getElementById("incoming-modal").style.display = "none";
      document.getElementById("video-container").style.display = "none";
      
      document.getElementById("chat-container-wrapper").style.height = "70vh";
      document.getElementById("chat-box").style.display = "flex";
      document.getElementById("input-area").style.display = "flex";
      
      if (pc) { pc.close(); pc = null; }
      if (localStream) { localStream.getTracks().forEach(function(track) { track.stop(); }); localStream = null; }
      if (triggerDelete) db.ref('call').remove();
    }
  </script>
</body>
</html>
