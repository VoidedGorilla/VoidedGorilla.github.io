<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord ANSI Text Generator</title>
<style>
  :root {
    --bg-main: #36393f;
    --bg-panel: #2f3136;
    --bg-input: #40444b;
    --border-color: #202225;
    --text-main: #dcddde;
    --text-muted: #8e9297;
    --accent: #5865f2;
    --accent-hover: #4752c4;
  }
  
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: 'gg sans', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 2rem;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;
  }
  
  .container {
    background: var(--bg-panel);
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    max-width: 1000px;
    width: 100%;
    display: flex;
    gap: 2rem;
  }
  
  @media (max-width: 800px) {
    .container { flex-direction: column; }
  }
  
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    min-width: 0;
  }
  
  h2 {
    margin: 0;
    color: #ffffff;
    font-size: 1.25rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 0.5rem;
  }
  
  .instruction {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: -0.5rem;
  }
  
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    background: var(--bg-input);
    padding: 0.75rem;
    border-radius: 6px 6px 0 0;
    border: 1px solid var(--border-color);
    border-bottom: none;
    align-items: center;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding-right: 0.75rem;
    border-right: 1px solid var(--border-color);
  }

  .tool-group:last-child {
    border-right: none;
  }

  .tool-label {
    font-size: 0.75rem;
    font-weight: bold;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-right: 0.2rem;
  }
  
  .format-btn {
    background: var(--bg-panel);
    color: var(--text-main);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.25rem 0.6rem;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.1s;
  }

  .format-btn:hover {
    background: var(--text-muted);
    color: #fff;
  }
  
  .color-btn {
    width: 22px;
    height: 22px;
    border: 2px solid var(--bg-panel);
    cursor: pointer;
    padding: 0;
    transition: transform 0.1s, border-color 0.1s;
  }

  #fg-tools .color-btn { border-radius: 50%; }
  #bg-tools .color-btn { border-radius: 4px; }

  .color-btn:hover {
    transform: scale(1.15);
    border-color: #fff;
  }
  
  .editor-box {
    width: 100%;
    min-height: 250px;
    background: var(--bg-input);
    border: 1px solid var(--border-color);
    border-radius: 0 0 6px 6px;
    color: var(--text-main);
    padding: 1rem;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 1rem;
    overflow-y: auto;
    outline: none;
    white-space: pre-wrap;
  }
  
  .editor-box:focus {
    border-color: #7289da;
  }
  
  .preview-container {
    background: #202225;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 1rem;
    min-height: 250px;
    flex-grow: 1;
    overflow-y: auto;
    position: relative;
  }

  .preview-code {
    margin: 0;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 0.9rem;
    color: #b9bbbe;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  
  .copy-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
    font-size: 0.95rem;
    width: 100%;
    margin-top: auto;
  }
  
  .copy-btn:hover { background: var(--accent-hover); }
</style>
</head>
<body>

<div class="container">
  <!-- Left Panel: Live Editor -->
  <div class="panel">
    <h2>1. Edit & Format</h2>
    <p class="instruction">Type your text, highlight a section, and select a color. Discord only supports the 8 specific colors shown below.</p>
    
    <div class="toolbar">
      <div class="tool-group">
        <button class="format-btn" onclick="formatText('bold')" title="Bold">B</button>
        <button class="format-btn" onclick="formatText('underline')" title="Underline" style="text-decoration: underline;">U</button>
      </div>
      <div class="tool-group" id="fg-tools">
        <span class="tool-label">Text</span>
        <!-- Populated by JS -->
      </div>
      <div class="tool-group" id="bg-tools">
        <span class="tool-label">Back</span>
        <!-- Populated by JS -->
      </div>
      <div class="tool-group">
        <button class="format-btn" onclick="clearFormat()" title="Remove formatting from selection">✕ Clear</button>
      </div>
    </div>
    
    <div id="editor" class="editor-box" contenteditable="true" spellcheck="false">Type here and format...</div>
  </div>
  
  <!-- Right Panel: Live Output -->
  <div class="panel">
    <h2>2. Live Output</h2>
    <p class="instruction">Your formatted code block is generated here automatically.</p>
    
    <div class="preview-container">
      <pre class="preview-code" id="output-code"><code></code></pre>
    </div>
    
    <button id="copy-btn" class="copy-btn" onclick="copyToClipboard()">Copy Codeblock</button>
  </div>
</div>

<script>
  // Discord's strict ANSI color palette
  const fgColors = [
    { id: '30', hex: '#4f545c', name: 'Gray' },
    { id: '31', hex: '#ed4245', name: 'Red' },
    { id: '32', hex: '#57f287', name: 'Green' },
    { id: '33', hex: '#fee75c', name: 'Yellow' },
    { id: '34', hex: '#3498db', name: 'Blue' },
    { id: '35', hex: '#eb459e', name: 'Pink' },
    { id: '36', hex: '#1abc9c', name: 'Cyan' },
    { id: '37', hex: '#ffffff', name: 'White' }
  ];

  const bgColors = [
    { id: '40', hex: '#18191c', name: 'Dark' },
    { id: '41', hex: '#e67e22', name: 'Orange' },
    { id: '42', hex: '#2ecc71', name: 'Marble' },
    { id: '43', hex: '#f1c40f', name: 'Gray-Yellow' },
    { id: '44', hex: '#7289da', name: 'Gray-Blue' },
    { id: '45', hex: '#9b59b6', name: 'Purple' },
    { id: '46', hex: '#11806a', name: 'Teal' },
    { id: '47', hex: '#ecf0f1', name: 'Light' }
  ];

  // Dynamic maps to accurately reverse browser RGB styles back to ANSI codes
  const ansiFgMap = {};
  const ansiBgMap = {};

  window.onload = () => {
    setupToolbar();
    setupEditorListeners();
    updateOutput();
  };

  function setupToolbar() {
    // We create a hidden element to let the browser convert hex to its own RGB format,
    // ensuring our color matching is fully accurate across all browsers.
    const tester = document.createElement('div');
    tester.style.position = 'absolute';
    tester.style.visibility = 'hidden';
    document.body.appendChild(tester);

    const fgContainer = document.getElementById('fg-tools');
    fgColors.forEach(c => {
      tester.style.color = c.hex;
      const rgb = window.getComputedStyle(tester).color.replace(/\s/g, '');
      ansiFgMap[rgb] = c.id;

      const btn = document.createElement('button');
      btn.className = 'color-btn';
      btn.style.backgroundColor = c.hex;
      btn.title = `Text: ${c.name}`;
      btn.onclick = () => formatText('foreColor', c.hex);
      fgContainer.appendChild(btn);
    });

    const bgContainer = document.getElementById('bg-tools');
    bgColors.forEach(c => {
      tester.style.backgroundColor = c.hex;
      const rgb = window.getComputedStyle(tester).backgroundColor.replace(/\s/g, '');
      ansiBgMap[rgb] = c.id;

      const btn = document.createElement('button');
      btn.className = 'color-btn';
      btn.style.backgroundColor = c.hex;
      btn.title = `Background: ${c.name}`;
      btn.onclick = () => formatBg(c.hex);
      bgContainer.appendChild(btn);
    });

    document.body.removeChild(tester);
  }

  function setupEditorListeners() {
    const editor = document.getElementById('editor');
    const events = ['input', 'keyup', 'mouseup', 'paste'];
    events.forEach(evt => editor.addEventListener(evt, () => {
      // Small timeout to allow native pasting/typing to resolve in DOM
      setTimeout(updateOutput, 10);
    }));
  }

  function formatText(command, value = null) {
    document.execCommand(command, false, value);
    document.getElementById('editor').focus();
    updateOutput();
  }

  function formatBg(hex) {
    // Handle cross-browser differences for background highlighting
    if (!document.execCommand('hiliteColor', false, hex)) {
      document.execCommand('backColor', false, hex);
    }
    document.getElementById('editor').focus();
    updateOutput();
  }

  function clearFormat() {
    document.execCommand('removeFormat');
    // Forcefully remove background colors if they persist
    document.execCommand('hiliteColor', false, 'transparent');
    document.execCommand('backColor', false, 'transparent');
    document.getElementById('editor').focus();
    updateOutput();
  }

  // Parses the editor's live HTML DOM into strict Discord ANSI format
  function walkDOM(node) {
    let result = '';

    node.childNodes.forEach(child => {
      if (child.nodeType === Node.TEXT_NODE) {
        const text = child.textContent;
        if (text === '') return;

        const compStyle = window.getComputedStyle(child.parentElement);
        let codes = [];

        const fgRgb = compStyle.color.replace(/\s/g, '');
        const bgRgb = compStyle.backgroundColor.replace(/\s/g, '');

        if (ansiFgMap[fgRgb]) codes.push(ansiFgMap[fgRgb]);
        if (ansiBgMap[bgRgb]) codes.push(ansiBgMap[bgRgb]);
        
        // Browsers return font weights numerically or as bold
        if (compStyle.fontWeight === '700' || compStyle.fontWeight === 'bold' || parseInt(compStyle.fontWeight) >= 700) {
            codes.push('1');
        }
        if (compStyle.textDecorationLine && compStyle.textDecorationLine.includes('underline')) {
            codes.push('4');
        }

        if (codes.length > 0) {
          result += `\x1B[${codes.join(';')}m${text}\x1B[0m`;
        } else {
          result += text;
        }

      } else if (child.nodeType === Node.ELEMENT_NODE) {
        if (child.tagName === 'BR') {
          result += '\n';
        } else if (child.tagName === 'DIV' || child.tagName === 'P') {
          result += '\n';
          // Prevent double newlines if the browser generates empty <div><br></div> elements
          child.childNodes.forEach(c => {
            if (c.tagName !== 'BR' || child.childNodes.length > 1) {
              result += walkDOM(c);
            }
          });
        } else {
          result += walkDOM(child);
        }
      }
    });

    return result;
  }

  function updateOutput() {
    const editor = document.getElementById('editor');
    
    // Trim leading newlines created by contenteditable div layouts
    let rawAnsi = walkDOM(editor).replace(/^\n+/, '');

    const outputCode = document.getElementById('output-code');
    if (rawAnsi.trim() === '') {
        outputCode.textContent = '';
    } else {
        outputCode.textContent = "```ansi\n" + rawAnsi + "\n```";
    }
  }

  function copyToClipboard() {
    const outputText = document.getElementById('output-code').textContent;
    if (!outputText) return;

    navigator.clipboard.writeText(outputText).then(() => {
      const btn = document.getElementById('copy-btn');
      const originalText = btn.textContent;
      btn.textContent = "Copied to Clipboard!";
      btn.style.background = "#3ba55c"; // Discord green
      
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = "";
      }, 2000);
    }).catch(err => {
      alert("Clipboard API failed. Please ensure you are running this securely via HTTPS or localhost.");
    });
  }
</script>

</body>
</html>
