<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Average Color Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        input[type="file"] {
            margin-bottom: 20px;
        }
        #imagePreview {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: none;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        canvas {
            display: none;
        }
        .results {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        #colorBox {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            transition: background-color 0.3s ease;
        }
        .data-row {
            font-size: 18px;
            margin: 5px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Average Color Extractor</h2>
    <input type="file" id="imageInput" accept="image/*">
    <img id="imagePreview" alt="Image Preview">
    <canvas id="canvas"></canvas>

    <div class="results">
        <div id="colorBox"></div>
        <div class="data-row" id="hexResult">HEX: #000000</div>
        <div class="data-row" id="rgbResult">RGB: 0, 0, 0</div>
    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const colorBox = document.getElementById('colorBox');
    const hexResult = document.getElementById('hexResult');
    const rgbResult = document.getElementById('rgbResult');

    imageInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Show image preview
                imagePreview.src = img.src;
                imagePreview.style.display = 'block';

                // Draw image to canvas to extract pixels
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0, img.width, img.height);

                // Get pixel data
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                let r = 0, g = 0, b = 0;
                let count = 0;

                // Loop through every pixel (4 values per pixel: R, G, B, A)
                for (let i = 0; i < data.length; i += 4) {
                    // Ignore fully transparent pixels
                    if (data[i + 3] > 0) {
                        r += data[i];
                        g += data[i + 1];
                        b += data[i + 2];
                        count++;
                    }
                }

                // Calculate the average
                if (count > 0) {
                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);
                }

                // Update UI
                updateResults(r, g, b);
            };
            img.src = e.target.result;
        };
        
        reader.readAsDataURL(file);
    });

    function updateResults(r, g, b) {
        const hex = rgbToHex(r, g, b);
        
        colorBox.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        hexResult.textContent = `HEX: ${hex}`;
        rgbResult.textContent = `RGB: ${r}, ${g}, ${b}`;
    }

    function rgbToHex(r, g, b) {
        return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
    }
</script>

</body>
</html>
